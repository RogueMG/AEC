# Cloudflare Pages project: static site from dist/, server code in functions/.
name = "asiatic-engineering"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

# Catalogue and enquiries (remote database created 2026-11-18, region APAC).
[[d1_databases]]
binding = "DB"
database_name = "aec-db"
database_id = "08ac7b2b-13b8-4812-ad7f-7730e39ff9ef"
migrations_dir = "migrations"

# Cloudflare Access for /admin and /api/admin (Zero Trust team "floral-recipe-5149", application
# "AEC admin"). Not secrets: both are visible in every sign-in token. server/auth.ts checks tokens
# against them, as a second lock behind Access itself.
[vars]
ACCESS_TEAM_DOMAIN = "floral-recipe-5149.cloudflareaccess.com"
ACCESS_AUD = "7dffd41ba35f277e7643f083f6734fba8812e03c59f5d7b38f3938f5fc0454f7"

# Images uploaded through the admin.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "aec-media"

# Enquiry email notifications go through the separate mailer Worker (workers/mailer), because
# Pages Functions can't use the send_email binding. Uncomment once that Worker is deployed and
# Email Routing is set up on the custom domain; until then enquiries are stored only.
# [[services]]
# binding = "MAILER"
# service = "aec-mailer"

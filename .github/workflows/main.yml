name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # The Studio (content admin) is built into dist/studio once sanity.project.json has a projectId.
      - name: Build Studio
        run: |
          if node -e "process.exit(require('./sanity.project.json').projectId ? 0 : 1)"; then
            npm ci --prefix studio
            npm run build --prefix studio
          else
            echo "No Sanity projectId in sanity.project.json yet; skipping the Studio build."
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
